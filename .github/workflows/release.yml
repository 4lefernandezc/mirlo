name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # Builds the NSIS + MSI installers, signs the updater artifacts with the
      # repository secret, creates the GitHub release (draft, publish manually)
      # and uploads the bundles, their `.sig` files and `latest.json`.
      - name: Build and publish to GitHub Releases
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Mirlo v__VERSION__"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/4lefernandezc/mirlo/blob/main/CHANGELOG.md) for the full list of changes.

            The `-setup.exe` (NSIS) is the recommended per-user installer; the `.msi` is intended for managed deployments (per-machine, administrator required). Both are signed for the built-in auto-updater.

            `Mirlo_<version>_portable_x64.zip` is the portable build: extract it anywhere and run `mirlo.exe`; all app data stays in a `data` folder next to the executable (`data\`) and updates are manual (download the new ZIP, see `README-PORTABLE.txt` inside). Not signed for the auto-updater.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

      # Portable distribution: the release exe plus the empty `portable.txt`
      # marker (data root -> `<exe_dir>\data`), license, notices and a short
      # README, zipped with the version from tauri.conf.json.
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $staging = "portable-staging"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item app/src-tauri/target/release/mirlo.exe $staging
          Copy-Item app/portable/README-PORTABLE.txt $staging
          Copy-Item LICENSE $staging
          Copy-Item THIRD_PARTY_NOTICES.md $staging
          New-Item -ItemType File -Path (Join-Path $staging "portable.txt") | Out-Null
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath "Mirlo_${version}_portable_x64.zip"
          Get-ChildItem "Mirlo_${version}_portable_x64.zip" | Select-Object Name, Length

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $artifacts = @()
          $artifacts += Get-ChildItem -Path app/src-tauri/target/release/bundle/nsis/*.exe
          $artifacts += Get-ChildItem -Path app/src-tauri/target/release/bundle/msi/*.msi
          $artifacts += Get-ChildItem -Path . -Filter "Mirlo_*_portable_x64.zip"
          $lines = foreach ($file in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii

      - name: Upload checksums and portable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = (Get-ChildItem -Path . -Filter "Mirlo_*_portable_x64.zip").FullName
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt $zip
