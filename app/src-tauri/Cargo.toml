[package]
name = "mirlo"
version = "0.1.0"
description = "A lightweight, open-source desktop client for YouTube Music"
authors = ["Mirlo contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/4lefernandezc/mirlo"

[lib]
name = "mirlo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
