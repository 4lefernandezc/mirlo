<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirlo - Settings</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --card: #16191f;
        --card-border: #303640;
        --text: #e8e8e8;
        --muted: #adb3bd;
        --accent: #f5a524;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
      }
      header, main, footer { padding: 20px 24px; }
      header {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        border-bottom: 1px solid var(--card-border);
      }
      header > div { flex: 1; }
      h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.025em; }
      header p { margin: 4px 0 0; color: var(--muted); }
      main { max-width: 960px; margin: 0 auto; padding-bottom: 80px; }
      .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; margin-bottom: 28px; }
      .search { flex: 1; min-width: 220px; }
      h2 { font-size: 17px; font-weight: 600; margin: 28px 0 12px; }
      article.plugin, .general {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .head strong { font-size: 15px; font-weight: 600; }
      .badge { color: var(--accent); font-size: 12px; margin-left: auto; }
      p.desc { color: var(--muted); max-width: 70ch; margin: 6px 0 0; }
      .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 20px; margin-top: 16px; }
      .options:empty { display: none; }
      label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
      label.inline { flex-direction: row; align-items: center; gap: 10px; }
      .general > label { padding: 12px 0; border-bottom: 1px solid var(--card-border); }
      .general > label:first-child { padding-top: 0; }
      .general > label:last-child { padding-bottom: 0; border-bottom: 0; }
      small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
      input, textarea, select, button { font: inherit; }
      input[type="text"], input[type="search"], input[type="number"], textarea, select {
        width: 100%;
        background: #0d0f13;
        border: 1px solid var(--card-border);
        border-radius: 6px;
        color: var(--text);
        padding: 8px 10px;
      }
      input[type="checkbox"] { accent-color: var(--accent); width: 17px; height: 17px; flex-shrink: 0; }
      textarea { font-family: Consolas, monospace; resize: vertical; min-height: 110px; }
      .wide { grid-column: 1 / -1; }
      .timer-actions { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin-top: 16px; }
      .timer-actions label { flex: 1; min-width: 190px; }
      .countdown { display: block; margin-top: 12px; font-variant-numeric: tabular-nums; }
      button { background: #22262e; color: var(--text); border: 1px solid var(--card-border); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #1a1408; font-weight: 600; }
      button:hover { border-color: var(--accent); }
      button:active { transform: translateY(1px); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      :disabled { opacity: 0.55; cursor: wait; }
      footer {
        position: fixed;
        bottom: 0;
        width: 100%;
        min-height: 44px;
        padding: 12px 24px;
        background: var(--bg);
        border-top: 1px solid var(--card-border);
        color: var(--muted);
        font-size: 13px;
      }
      footer[data-error="true"] { color: #ffb4ab; }
    </style>
    <script defer src="settings-i18n.js"></script>
    <script defer src="settings.js"></script>
  </head>
  <body>
    <header>
      <div>
        <h1 data-i18n="Mirlo — Settings">Mirlo — Settings</h1>
        <p data-i18n="Your preferences, saved on this device.">Your preferences, saved on this device.</p>
      </div>
      <button id="reload" class="primary" disabled data-i18n="Reload player">Reload player</button>
    </header>
    <main>
      <div class="toolbar">
        <label class="field search">
          <span data-i18n="Search settings">Search settings</span>
          <input id="search" type="search" disabled />
        </label>
        <label class="field">
          <span data-i18n="Category">Category</span>
          <select id="category" disabled></select>
        </label>
        <label class="field inline">
          <input id="enabled-only" type="checkbox" disabled />
          <span data-i18n="Enabled only">Enabled only</span>
        </label>
      </div>
      <div id="groups"></div>
      <p id="empty" hidden data-i18n="No matching settings.">No matching settings.</p>
    </main>
    <footer id="status" role="status" aria-live="polite">Loading settings…</footer>
  </body>
</html>
