name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-windows:
    name: Release (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # Builds the NSIS + MSI installers, signs the updater artifacts with the
      # repository secret, creates the GitHub release (draft, publish manually)
      # and uploads the bundles, their `.sig` files and `latest.json`.
      - name: Build and publish to GitHub Releases
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: "npx --yes @tauri-apps/cli@2.12.3"
          tagName: ${{ github.ref_name }}
          releaseName: "Mirlo v__VERSION__"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/4lefernandezc/mirlo/blob/main/CHANGELOG.md) for the full list of changes.

            Windows: the `-setup.exe` (NSIS) is the recommended per-user installer; the `.msi` is intended for managed deployments (per-machine, administrator required). Both are signed for the built-in auto-updater.

            Linux: `Mirlo_<version>_amd64.AppImage` includes WebKitGTK, selected AAC/Opus multimedia libraries and sandbox helpers; it works with the built-in auto-updater. A desktop with glibc 2.35+ and working user namespaces is required. The `.deb` uses distribution dependencies. Corresponding sources, notices and rebuilding instructions are in `Mirlo_<version>_linux-sources.tar.zst` — see [install docs](https://github.com/4lefernandezc/mirlo/blob/main/docs/user/install.md).

            `Mirlo_<version>_portable_x64.zip` is the portable Windows build: extract it anywhere and run `mirlo.exe`; all app data stays in a `data` folder next to the executable (`data\`) and updates are manual (download the new ZIP, see `README-PORTABLE.txt` inside). Not signed for the auto-updater.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

      # Portable distribution: the release exe plus the empty `portable.txt`
      # marker (data root -> `<exe_dir>\data`), license, notices and a short
      # README, zipped with the version from tauri.conf.json.
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $staging = "portable-staging"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item app/src-tauri/target/release/mirlo.exe $staging
          Copy-Item app/portable/README-PORTABLE.txt $staging
          Copy-Item LICENSE $staging
          Copy-Item THIRD_PARTY_NOTICES.md $staging
          New-Item -ItemType File -Path (Join-Path $staging "portable.txt") | Out-Null
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath "Mirlo_${version}_portable_x64.zip"
          Get-ChildItem "Mirlo_${version}_portable_x64.zip" | Select-Object Name, Length

      - name: Upload portable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = (Get-ChildItem -Path . -Filter "Mirlo_*_portable_x64.zip").FullName
          gh release upload "${{ github.ref_name }}" $zip

  release-linux:
    name: Release (Linux x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          printf '%s\n' \
            'deb-src http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse' \
            'deb-src http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse' \
            'deb-src http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse' \
            | sudo tee /etc/apt/sources.list.d/mirlo-sources.list
          sudo apt-get update
          # Match installed runtime libraries to versions still in signed source indexes.
          sudo apt-get upgrade -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential curl wget file nasm meson ninja-build pkg-config python3 dpkg-dev zstd squashfs-tools libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad bubblewrap xdg-dbus-proxy
          npm install --global @tauri-apps/cli@2.12.3

      - name: Build selected LGPL-configured codecs
        run: bash tools/linux/build-codecs.sh /tmp/mirlo-linux

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # Builds the AppImage + deb, signs the updater artifacts and adds the
      # Linux bundles and its `latest.json` platform entry to the same draft
      # release created by the Windows job.
      - name: Build and publish to GitHub Releases
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: "bash ../tools/linux/release.sh"
          tagName: ${{ github.ref_name }}
          releaseName: "Mirlo v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: "--bundles appimage,deb"

      - name: Upload corresponding Linux sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" app/src-tauri/target/release/bundle/Mirlo_*_linux-sources.tar.zst

  checksums:
    name: Checksums
    needs: [release-windows, release-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Generate SHA-256 checksums for every uploaded bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ github.ref_name }}" --pattern "Mirlo_*" --dir assets
          cd assets
          sha256sum Mirlo_* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt
