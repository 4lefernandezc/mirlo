<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirlo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #0f1115;
        color: #e8e8e8;
        font: 14px/1.6 "Segoe UI", system-ui, sans-serif;
      }
      main {
        max-width: 40rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        color: #9aa0a6;
        margin: 0.25rem 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mirlo</h1>
      <p>This window hosts the official YouTube Music player.</p>
      <p>
        If you are seeing this page, the player could not be loaded. Check your
        connection and restart Mirlo.
      </p>
    </main>
  </body>
</html>
