name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # Builds the NSIS + MSI installers, signs the updater artifacts with the
      # repository secret, creates the GitHub release (draft, publish manually)
      # and uploads the bundles, their `.sig` files and `latest.json`.
      - name: Build and publish to GitHub Releases
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Mirlo v__VERSION__"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/4lefernandezc/mirlo/blob/main/CHANGELOG.md) for the full list of changes.

            The `-setup.exe` (NSIS) is the recommended per-user installer; the `.msi` is intended for managed deployments (per-machine, administrator required). Both are signed for the built-in auto-updater.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $artifacts = @()
          $artifacts += Get-ChildItem -Path app/src-tauri/target/release/bundle/nsis/*.exe
          $artifacts += Get-ChildItem -Path app/src-tauri/target/release/bundle/msi/*.msi
          $lines = foreach ($file in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii

      - name: Upload checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS.txt
