[package]
name = "mirlo"
version = "0.1.0"
description = "A lightweight, open-source desktop client for YouTube Music"
authors = ["Mirlo contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/4lefernandezc/mirlo"

[lib]
name = "mirlo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Ad-block v1 hooks into the WebView2 controller directly. webview2-com must
# match the version tauri 2.12 uses so its COM types are interchangeable, and
# `windows` must be the same major the vendored webview2-com-sys links against
# (0.62). Feature notes: Win32_System_Com provides IStream, Win32_UI_Shell
# SHCreateMemStream (ad-block v1); Media/Foundation/Storage_Streams provide
# the System Media Transport Controls surface, Win32_System_WinRT its HWND
# interop factory (media session).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
