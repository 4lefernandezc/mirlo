<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Mirlo</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #fafafa;
        --text: #202124;
        --muted: #62666c;
        --button: #202124;
        --button-text: #fafafa;
        --focus: #966000;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #151515;
          --text: #f2f2f2;
          --muted: #b0b0b0;
          --button: #f2f2f2;
          --button-text: #202124;
          --focus: #f5a524;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--text);
        font: 16px/1.6 "Segoe UI", system-ui, sans-serif;
      }
      main { width: min(100%, 34rem); padding: 40px 24px; text-align: center; }
      img { display: block; width: 64px; height: 64px; margin: 0 auto 28px; }
      h1 { margin: 0 0 12px; font-size: clamp(24px, 4vw, 30px); line-height: 1.25; letter-spacing: -0.025em; }
      p { margin: 0 auto; max-width: 28rem; color: var(--muted); }
      a {
        display: inline-block;
        margin-top: 28px;
        padding: 10px 28px;
        border-radius: 24px;
        background: var(--button);
        color: var(--button-text);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { opacity: 0.85; }
      a:active { transform: translateY(1px); }
      a:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    </style>
    <script src="offline.js" defer></script>
  </head>
  <body>
    <main>
      <img src="mirlo.png" alt="Mirlo" width="64" height="64" />
      <h1>Connect Mirlo to the internet</h1>
      <p>Music needs an internet connection. We'll reconnect automatically when you're back online.</p>
      <a href="https://music.youtube.com/">Try again</a>
    </main>
  </body>
</html>
